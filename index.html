<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>myLUAS</title>
<script>
  // Apply the saved display mode before first paint to avoid a flash
  try { if (localStorage.getItem("myLUAS.board") === "1") document.documentElement.classList.add("board"); } catch (e) {}
</script>
<style>
  :root {
    --bg: #f6f1ea;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7385;
    --line: #e6dfd3;
    --track: #c5bdb0;
    --accent: #3a5bd9;
    --notice-bg: #fff4d6;
    --notice-text: #5c4300;
    --err-bg: #fdecea;
    --err-text: #8a2a1f;
    --err-line: #f3c4be;
    color-scheme: light;
  }
  body[data-line="red"]   { --accent: #d4213d; }
  body[data-line="green"] { --accent: #1b8f4e; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2030;
      --text: #f1f3f8;
      --muted: #98a0b3;
      --line: #2a3045;
      --track: #3a4259;
      --accent: #8aa2ff;
      --notice-bg: #3a3014;
      --notice-text: #ffe29a;
      --err-bg: #3a1a17;
      --err-text: #ffb4aa;
      --err-line: #5c2a25;
      color-scheme: dark;
    }
    body[data-line="red"]   { --accent: #ff6b7f; }
    body[data-line="green"] { --accent: #4cd08a; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
  }
  [hidden] { display: none !important; }
  .wrap {
    max-width: 30rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-height: calc(100dvh - 2.5rem);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 0.75rem;
  }
  header h1 {
    font-size: 1.6rem;
    letter-spacing: -0.02em;
    font-weight: 800;
  }
  header h1 span { font-weight: 400; color: var(--muted); }
  header h1 b { color: var(--accent); }

  /* display-mode switch */
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0.25rem 0;
  }
  .toggle:focus-visible, .near-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .track {
    position: relative;
    width: 2.5rem;
    height: 1.45rem;
    border-radius: 999px;
    background: var(--track);
    transition: background 0.2s;
  }
  .thumb {
    position: absolute;
    top: 0.2rem;
    left: 0.2rem;
    width: 1.05rem;
    height: 1.05rem;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .toggle[aria-checked="true"] .track { background: var(--accent); }
  .toggle[aria-checked="true"] .thumb { transform: translateX(1.05rem); }

  /* stop picker */
  .picker label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: 1.1rem;
    top: 50%;
    width: 0.6rem;
    height: 0.6rem;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 1rem;
    padding: 0.85rem 2.6rem 0.85rem 1rem;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  /* nearest stop */
  .near-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent);
    background: transparent;
    border: 2px solid var(--accent);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }
  .near-btn:disabled { opacity: 0.6; cursor: progress; }
  .near-info {
    margin-top: 0.6rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1rem;
    padding: 0.7rem 1rem;
    font-size: 0.95rem;
  }
  .near-info .near-small {
    display: block;
    margin-top: 0.25rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .near-error { margin-top: 0.6rem; }

  /* current stop */
  .stop-head {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .stop-head h2 {
    font-size: 1.35rem;
    letter-spacing: -0.01em;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
  }

  .notice {
    background: var(--notice-bg);
    color: var(--notice-text);
    border-radius: 1rem;
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
  }
  .notice small {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 0.15rem;
  }
  .error {
    background: var(--err-bg);
    color: var(--err-text);
    border: 1px solid var(--err-line);
    border-radius: 1rem;
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
  }
  .error p + p { margin-top: 0.35rem; }

  /* directions (normal mode) */
  #results { display: flex; flex-direction: column; gap: 1rem; }
  .card {
    background: var(--card);
    border-radius: 1.25rem;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .card h3 {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.85rem 1.1rem 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card h3::before {
    content: "";
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--accent);
  }
  .tram {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 1.1rem;
    border-top: 1px solid var(--line);
  }
  .tram .dest {
    font-size: 1.05rem;
    font-weight: 600;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .tram .due {
    font-size: 2.6rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tram .due small {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    margin-left: 0.2rem;
    letter-spacing: 0;
  }
  .tram .due.now { color: var(--accent); }
  .empty {
    padding: 0.8rem 1.1rem 1rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1rem;
  }

  /* departures board table (board mode) */
  .board-wrap { overflow-x: auto; }
  table.board {
    width: 100%;
    border-collapse: collapse;
  }
  .board th {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: left;
    color: var(--muted);
    padding: 0.5rem 0.4rem;
    border-bottom: 2px solid var(--accent);
  }
  .board th:last-child { text-align: right; }
  .board td {
    padding: 0.7rem 0.4rem;
    border-bottom: 1px dashed var(--line);
    vertical-align: baseline;
  }
  .board .b-dest {
    font-size: 1.05rem;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  .board .b-dir {
    font-size: 0.72rem;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .board .b-due {
    text-align: right;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }
  .board .b-due small {
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
    margin-left: 0.25rem;
  }
  .board .b-due.now { animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .board .b-due.now { animation: none; } }

  .status {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
  }
  footer {
    margin-top: auto;
    padding-top: 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }

  /* ---------- Airport departures board theme ---------- */
  html.board {
    --bg: #000000;
    --card: #000000;
    --text: #ffb000;
    --muted: #b37a00;
    --line: #3d2a00;
    --track: #3d2a00;
    --accent: #ffb000;
    --notice-bg: #000000;
    --notice-text: #ffb000;
    --err-bg: #000000;
    --err-text: #ff7a66;
    --err-line: #7a2a20;
    color-scheme: dark;
  }
  html.board body[data-line="red"],
  html.board body[data-line="green"] { --accent: #ffb000; }
  html.board body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
    text-shadow: 0 0 6px rgba(255, 176, 0, 0.3);
    letter-spacing: 0.02em;
  }
  html.board select,
  html.board .near-info,
  html.board .notice,
  html.board .error,
  html.board .badge { border-radius: 0.25rem; }
  html.board select { text-transform: uppercase; }
  html.board select option,
  html.board select optgroup { background: #000; color: #ffb000; }
  html.board .badge { color: #000; text-shadow: none; }
  html.board .thumb { background: #000; }
  html.board .stop-head h2 { text-transform: uppercase; letter-spacing: 0.06em; }
  html.board .notice { border: 1px solid var(--line); }
  html.board .board-wrap { border: 1px solid var(--line); padding: 0 0.6rem; }
</style>
</head>
<body data-line="">
  <div class="wrap">
    <header>
      <h1><span>my</span><b>LUAS</b></h1>
      <button type="button" class="toggle" id="boardToggle" role="switch" aria-checked="false">
        <span>Departures board</span>
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      </button>
    </header>

    <div class="picker">
      <label for="stop">Your stop</label>
      <div class="select-wrap">
        <select id="stop" aria-label="Choose your Luas stop">
          <option value="MYS">Loading stops…</option>
        </select>
      </div>

      <button type="button" class="near-btn" id="nearBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
        <span id="nearLabel">Nearest stop</span>
      </button>
      <div class="near-info" id="nearInfo" aria-live="polite" hidden></div>
      <div class="error near-error" id="nearError" role="alert" hidden></div>
    </div>

    <div class="stop-head">
      <h2 id="stopName">Loading…</h2>
      <span class="badge" id="badge" hidden></span>
    </div>

    <div class="error" id="errors" role="alert" hidden></div>
    <div class="notice" id="notice" hidden></div>

    <div id="results" aria-live="polite">
      <div class="loading">Loading trams…</div>
    </div>

    <p class="status" id="status">Refreshes every 20 seconds</p>

    <footer>Data: Transport Infrastructure Ireland. Built by Andrea Espinal for BDAIB.</footer>
  </div>

<script>
  var BASE = "https://luas-class.kluxy.app";
  var STORAGE_KEY = "myLUAS.stop";
  var BOARD_KEY = "myLUAS.board";
  var DEFAULT_STOP = "MYS";
  var REFRESH_MS = 20000;
  var WALK_KMH = 5;
  var LINE_LABELS = { red: "Red Line", green: "Green Line" };

  var selectEl = document.getElementById("stop");
  var stopNameEl = document.getElementById("stopName");
  var badgeEl = document.getElementById("badge");
  var errorsEl = document.getElementById("errors");
  var noticeEl = document.getElementById("notice");
  var resultsEl = document.getElementById("results");
  var statusEl = document.getElementById("status");
  var nearBtn = document.getElementById("nearBtn");
  var nearLabel = document.getElementById("nearLabel");
  var nearInfoEl = document.getElementById("nearInfo");
  var nearErrorEl = document.getElementById("nearError");
  var boardToggle = document.getElementById("boardToggle");

  var stops = [];
  var stopsLoaded = false;
  var stopsPromise = null;
  var requestCounter = 0;
  var lastUpdated = null;
  var lastData = null;
  var currentId = readSaved();
  var boardMode = readBoard();

  /* ---------- Storage helpers ---------- */
  function readSaved() {
    try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_STOP; }
    catch (e) { return DEFAULT_STOP; }
  }
  function saveChoice(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* storage unavailable */ }
  }
  function readBoard() {
    try { return localStorage.getItem(BOARD_KEY) === "1"; }
    catch (e) { return false; }
  }
  function saveBoard(on) {
    try { localStorage.setItem(BOARD_KEY, on ? "1" : "0"); } catch (e) { /* storage unavailable */ }
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function describeError(err) {
    if (err && err.name === "TypeError") {
      return "Network problem, please check your connection (" + err.message + ").";
    }
    return err && err.message ? err.message : String(err);
  }

  async function getJSON(url) {
    var res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("Server replied with HTTP " + res.status + ".");
    var data = await res.json();
    if (data && data.error) throw new Error(String(data.error));
    return data;
  }

  /* ---------- Stops dropdown ---------- */
  function buildSelect() {
    selectEl.textContent = "";
    var groups = {};
    stops.forEach(function (s) {
      var key = LINE_LABELS[s.line] ? s.line : "other";
      if (!groups[key]) {
        groups[key] = document.createElement("optgroup");
        groups[key].label = LINE_LABELS[key] || "Other";
      }
      var opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.name;
      groups[key].appendChild(opt);
    });
    ["red", "green", "other"].forEach(function (key) {
      if (groups[key]) selectEl.appendChild(groups[key]);
    });

    var known = stops.some(function (s) { return s.id === currentId; });
    if (!known) {
      var fallback = stops.some(function (s) { return s.id === DEFAULT_STOP; }) ? DEFAULT_STOP : (stops[0] && stops[0].id);
      if (fallback) currentId = fallback;
    }
    selectEl.value = currentId;
    updateBadge();
  }

  function fallbackSelect() {
    selectEl.textContent = "";
    var opt = document.createElement("option");
    opt.value = currentId;
    opt.textContent = "Stop " + currentId;
    selectEl.appendChild(opt);
    selectEl.value = currentId;
  }

  function loadStops() {
    if (!stopsPromise) {
      stopsPromise = getJSON(BASE + "/stops").then(function (data) {
        if (!data || !Array.isArray(data.stops) || !data.stops.length) {
          throw new Error("The stop list came back in an unexpected format.");
        }
        stops = data.stops;
        stopsLoaded = true;
        buildSelect();
      }).finally(function () { stopsPromise = null; });
    }
    return stopsPromise;
  }

  function currentLine() {
    for (var i = 0; i < stops.length; i++) {
      if (stops[i].id === currentId) return stops[i].line;
    }
    return "";
  }
  function updateBadge() {
    var line = currentLine();
    document.body.setAttribute("data-line", LINE_LABELS[line] ? line : "");
    if (LINE_LABELS[line]) {
      badgeEl.textContent = LINE_LABELS[line];
      badgeEl.hidden = false;
    } else {
      badgeEl.hidden = true;
    }
  }

  /* ---------- Rendering ---------- */
  function dueInfo(due) {
    var blank = due === null || due === undefined || due === "";
    var n = Number(due);
    if (blank) return { text: "–", unit: "", now: false };
    if (Number.isNaN(n)) return { text: String(due), unit: "", now: false };
    if (n === 0) return { text: "Due", unit: "", now: true };
    return { text: String(n), unit: "min", now: false };
  }

  function renderCards(dirs) {
    dirs.forEach(function (dir) {
      var card = el("section", "card");
      card.appendChild(el("h3", null, dir.name || "Direction"));
      var trams = Array.isArray(dir.trams) ? dir.trams.slice(0, 3) : [];
      if (!trams.length) {
        card.appendChild(el("div", "empty", "No trams forecast."));
      } else {
        trams.forEach(function (t) {
          var info = dueInfo(t.due);
          var row = el("div", "tram");
          row.appendChild(el("div", "dest", t.destination || "Tram"));
          var due = el("div", "due" + (info.now ? " now" : ""), info.text);
          if (info.unit) due.appendChild(el("small", null, info.unit));
          row.appendChild(due);
          card.appendChild(row);
        });
      }
      resultsEl.appendChild(card);
    });
  }

  function renderBoard(dirs) {
    var rows = [];
    dirs.forEach(function (dir) {
      var trams = Array.isArray(dir.trams) ? dir.trams.slice(0, 3) : [];
      trams.forEach(function (t) {
        var n = Number(t.due);
        rows.push({
          dir: dir.name || "",
          dest: t.destination || "Tram",
          due: t.due,
          sort: (t.due === null || t.due === undefined || t.due === "" || Number.isNaN(n)) ? Infinity : n
        });
      });
    });
    rows.sort(function (a, b) { return a.sort - b.sort; });

    var wrap = el("div", "board-wrap");
    var table = el("table", "board");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", null, "Destination"));
    hr.appendChild(el("th", null, "Direction"));
    hr.appendChild(el("th", null, "Due"));
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    if (!rows.length) {
      var emptyRow = el("tr");
      var cell = el("td", "b-dest", "No trams forecast.");
      cell.colSpan = 3;
      emptyRow.appendChild(cell);
      tbody.appendChild(emptyRow);
    } else {
      rows.forEach(function (r) {
        var info = dueInfo(r.due);
        var tr = el("tr");
        tr.appendChild(el("td", "b-dest", r.dest));
        tr.appendChild(el("td", "b-dir", r.dir));
        var due = el("td", "b-due" + (info.now ? " now" : ""), info.text);
        if (info.unit) due.appendChild(el("small", null, info.unit));
        tr.appendChild(due);
        tbody.appendChild(tr);
      });
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
    resultsEl.appendChild(wrap);
  }

  function render(data) {
    lastData = data;
    stopNameEl.textContent = data.stopName || ("Stop " + currentId);

    var msg = (data.message || "").toString().trim();
    if (msg) {
      noticeEl.textContent = "";
      noticeEl.appendChild(el("small", null, "Service message"));
      noticeEl.appendChild(document.createTextNode(msg));
      noticeEl.hidden = false;
    } else {
      noticeEl.hidden = true;
    }

    resultsEl.textContent = "";
    var dirs = Array.isArray(data.directions) ? data.directions : [];
    if (!dirs.length) {
      resultsEl.appendChild(el("div", "loading", "No forecast is available for this stop right now."));
      return;
    }
    if (boardMode) renderBoard(dirs); else renderCards(dirs);
  }

  function showErrors(list) {
    errorsEl.textContent = "";
    if (!list.length) { errorsEl.hidden = true; return; }
    list.forEach(function (msg) { errorsEl.appendChild(el("p", null, msg)); });
    errorsEl.hidden = false;
  }

  function updateStatus() {
    if (!lastUpdated) { statusEl.textContent = "Refreshes every 20 seconds"; return; }
    statusEl.textContent = "Last updated " + lastUpdated.toLocaleTimeString("en-GB", { hour12: false }) + " · refreshes every 20 s";
  }

  /* ---------- Refresh ---------- */
  async function refresh() {
    var mine = ++requestCounter;
    var errors = [];

    if (!stopsLoaded) {
      try { await loadStops(); }
      catch (e) {
        errors.push("Couldn’t load the list of stops: " + describeError(e));
        if (!selectEl.options.length || !stops.length) fallbackSelect();
      }
    }

    var stopAtRequest = currentId;
    try {
      var data = await getJSON(BASE + "/forecast?stop=" + encodeURIComponent(stopAtRequest));
      if (mine !== requestCounter) return; // a newer request took over
      if (!data || !Array.isArray(data.directions)) {
        throw new Error("The forecast came back in an unexpected format.");
      }
      render(data);
      lastUpdated = new Date();
      updateStatus();
    } catch (e) {
      if (mine !== requestCounter) return;
      errors.push("Couldn’t load live trams: " + describeError(e));
      if (!resultsEl.querySelector(".card, .board-wrap")) {
        resultsEl.textContent = "";
        stopNameEl.textContent = "Stop " + stopAtRequest;
      }
    }
    showErrors(errors);
  }

  function selectStop(id) {
    currentId = id;
    saveChoice(id);
    selectEl.value = id;
    updateBadge();
    stopNameEl.textContent = "Loading…";
    noticeEl.hidden = true;
    resultsEl.textContent = "";
    resultsEl.appendChild(el("div", "loading", "Loading trams…"));
    lastUpdated = null;
    lastData = null;
    updateStatus();
    refresh();
  }

  /* ---------- Nearest stop (geolocation + haversine) ---------- */
  function toRad(deg) { return deg * Math.PI / 180; }

  // Great-circle distance between two lat/lng points, in kilometres
  function haversineKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = toRad(lat2 - lat1);
    var dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  function formatDistance(km) {
    var m = km * 1000;
    if (m < 100) return Math.round(m) + " m";
    if (m < 1000) return (Math.round(m / 10) * 10) + " m";
    if (km < 100) return km.toFixed(1) + " km";
    return Math.round(km) + " km";
  }

  function formatWalk(km) {
    var minutes = km / WALK_KMH * 60;
    if (minutes < 1) return "under 1 min walk";
    var m = Math.round(minutes);
    if (m < 60) return "about " + m + " min walk";
    var h = Math.floor(m / 60);
    var r = m % 60;
    return "about " + h + " h" + (r ? " " + r + " min" : "") + " walk";
  }

  function getPosition() {
    return new Promise(function (resolve, reject) {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 60000
      });
    });
  }

  function geoErrorMessage(err) {
    var secureHint = window.isSecureContext ? "" : " This page isn’t served over https, which browsers require for location.";
    if (err && typeof err.code === "number") {
      if (err.code === 1) return "Location permission was denied. Allow location access for this page in your browser settings and try again." + secureHint;
      if (err.code === 2) return "Your location couldn’t be determined. Check that location services are switched on." + secureHint;
      if (err.code === 3) return "Finding your location took too long. Please try again.";
    }
    return describeError(err);
  }

  function showNearest(stop, km) {
    nearInfoEl.textContent = "";
    var title = el("div", null, "Nearest stop: ");
    title.appendChild(el("strong", null, stop.name));
    nearInfoEl.appendChild(title);
    nearInfoEl.appendChild(el("div", null, formatDistance(km) + " away · " + formatWalk(km)));
    var note = "Straight-line distance, walking at " + WALK_KMH + " km/h.";
    if (km > 20) note += " You seem to be a long way from the Luas network.";
    nearInfoEl.appendChild(el("span", "near-small", note));
    nearInfoEl.hidden = false;
  }

  async function findNearest() {
    nearErrorEl.hidden = true;
    nearBtn.disabled = true;
    nearLabel.textContent = "Locating…";
    try {
      if (!("geolocation" in navigator)) {
        throw new Error("This browser doesn’t support location.");
      }
      if (!stopsLoaded) {
        try { await loadStops(); }
        catch (e) { throw new Error("Couldn’t load the list of stops: " + describeError(e)); }
      }
      var pos = await getPosition();
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;

      var best = null;
      stops.forEach(function (s) {
        var sLat = Number(s.lat), sLng = Number(s.lng);
        if (!isFinite(sLat) || !isFinite(sLng)) return;
        var d = haversineKm(lat, lng, sLat, sLng);
        if (!best || d < best.km) best = { stop: s, km: d };
      });
      if (!best) throw new Error("None of the stops have usable coordinates.");

      showNearest(best.stop, best.km);
      selectStop(best.stop.id);
    } catch (e) {
      nearInfoEl.hidden = true;
      nearErrorEl.textContent = e && e.code ? geoErrorMessage(e) : describeError(e);
      nearErrorEl.hidden = false;
    } finally {
      nearBtn.disabled = false;
      nearLabel.textContent = "Nearest stop";
    }
  }

  /* ---------- Display mode ---------- */
  function applyBoard() {
    document.documentElement.classList.toggle("board", boardMode);
    boardToggle.setAttribute("aria-checked", String(boardMode));
  }

  /* ---------- Events ---------- */
  selectEl.addEventListener("change", function () {
    nearInfoEl.hidden = true;
    nearErrorEl.hidden = true;
    selectStop(selectEl.value);
  });

  nearBtn.addEventListener("click", findNearest);

  boardToggle.addEventListener("click", function () {
    boardMode = !boardMode;
    saveBoard(boardMode);
    applyBoard();
    if (lastData) render(lastData);
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) refresh();
  });

  applyBoard();
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
